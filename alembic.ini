[alembic]
# `script_location` is resolved relative to the current working directory when
# running the `alembic` CLI, and overridden with an absolute path by
# src.db.schema.init_db when migrations run at API startup.
script_location = migrations
# Make the repository root importable so env.py can `import src.*`.
prepend_sys_path = .
# Populated at runtime from settings (DATABASE_URL) or via init_db; leave blank.
sqlalchemy.url =
