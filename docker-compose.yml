# Production stack for the custom RAG service.
#
#   api       FastAPI (internal only — reach via frontend /api proxy)
#   qdrant    vector store
#   redis     semantic cache + rate limits
#   postgres  document store + FTS
#   frontend  Caddy: SPA + TLS + /api reverse proxy (only public entrypoint)
#
# Local dev with published ports:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# Production:
#   1. Copy .env.example → .env and run:  python scripts/setup_production_env.py ...
#   2. Set APP_ENV=production, SITE_DOMAIN, CADDY_EMAIL, CORS_ORIGINS
#   3. docker compose up -d --build

name: advance-rag

x-api-db-env: &api_db_env
  QDRANT_URL: http://qdrant:6333
  QDRANT_API_KEY: ""
  REDIS_URL: redis://redis:6379/0
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-raguser}:${POSTGRES_PASSWORD:-ragpassword}@postgres:5432/${POSTGRES_DB:-ragdb}
  DOC_STORE_DIR: /data/doc_store
  BM25_INDEX_FILE: /data/bm25_index.pkl
  INGESTION_MANIFEST_FILE: /data/ingestion_manifest.json

services:
  api:
    build:
      context: .
    image: advance-rag-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *api_db_env
    volumes:
      - rag_data:/data
    # No host port — traffic enters through the frontend Caddy proxy only.
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  qdrant:
    image: qdrant/qdrant:v1.18.3
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis/redis-stack-server:7.4.0-v3
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragpassword}
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raguser} -d ${POSTGRES_DB:-ragdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    image: advance-rag-frontend:latest
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-}
      CADDY_EMAIL: ${CADDY_EMAIL:-}
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
      - "${WEB_HTTPS_PORT:-443}:443"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ingest:
    profiles: ["tools"]
    build:
      context: .
    image: advance-rag-api:latest
    env_file: .env
    environment:
      <<: *api_db_env
      RAW_PDFS_DIR: /pdfs
    volumes:
      - rag_data:/data
      - ./real_pdfs:/pdfs:ro
    entrypoint: ["python", "scripts/ingest.py"]
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: "no"

  worker:
    profiles: ["tools"]
    build:
      context: .
    image: advance-rag-api:latest
    env_file: .env
    environment:
      <<: *api_db_env
      RAW_PDFS_DIR: /pdfs
    volumes:
      - rag_data:/data
      - ./real_pdfs:/pdfs:ro
    entrypoint: ["celery", "-A", "src.ingestion.tasks", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  rag_data:
  qdrant_data:
  redis_data:
  pg_data:
