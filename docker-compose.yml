# Production stack for the custom RAG service.
#
#   api       FastAPI: hybrid retrieval, reranking, generation, semantic cache
#   qdrant    vector store (server mode — embedded mode is single-process only)
#   redis     Redis Stack: semantic-cache vector index + rate-limit counters
#   frontend  Caddy serving the built SPA and proxying /api -> api:8000
#   ingest    one-shot ingestion job, run explicitly with --profile tools
#
# Usage:
#   docker compose up -d --build
#   docker compose --profile tools run --rm ingest --limit 5

name: advance-rag

services:
  api:
    build:
      context: .
    image: advance-rag-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # Container-internal addresses win over whatever .env contains, so the
      # same .env works for local development and for the compose stack.
      QDRANT_URL: http://qdrant:6333
      # Cleared explicitly: .env may hold a Qdrant Cloud key, and sending it to
      # the local server produces an "insecure connection" warning.
      QDRANT_API_KEY: ""
      REDIS_URL: redis://redis:6379/0
      DOC_STORE_DIR: /data/doc_store
      BM25_INDEX_FILE: /data/bm25_index.pkl
      INGESTION_MANIFEST_FILE: /data/ingestion_manifest.json
    volumes:
      - rag_data:/data
    ports:
      # Published for direct/debug access. In production, front the stack with
      # TLS (see README) and stop publishing this.
      - "${API_PORT:-8000}:8000"
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  qdrant:
    # Kept aligned with the qdrant-client pin in requirements.txt: the client
    # warns when the server's minor version differs by more than one.
    image: qdrant/qdrant:v1.18.3
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    # redis-stack-server is required: the plain `redis` image has no vector index.
    image: redis/redis-stack-server:7.4.0-v3
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    image: advance-rag-frontend:latest
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ingest:
    profiles: ["tools"]
    build:
      context: .
    image: advance-rag-api:latest
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ""
      REDIS_URL: redis://redis:6379/0
      RAW_PDFS_DIR: /pdfs
      DOC_STORE_DIR: /data/doc_store
      BM25_INDEX_FILE: /data/bm25_index.pkl
      INGESTION_MANIFEST_FILE: /data/ingestion_manifest.json
    volumes:
      - rag_data:/data
      # Mount the corpus read-only; ingestion never writes to it.
      - ./real_pdfs:/pdfs:ro
    # entrypoint (not command) so that `docker compose run ingest --limit 5`
    # appends the flag to the script instead of replacing the whole command.
    entrypoint: ["python", "scripts/ingest.py"]
    depends_on:
      qdrant:
        condition: service_healthy
    restart: "no"

volumes:
  rag_data:
  qdrant_data:
  redis_data:
